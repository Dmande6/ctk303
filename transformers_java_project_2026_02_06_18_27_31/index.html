<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SAVE CYBERTRON\</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>

  <script src="sketch.js" defer></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0b0b0b;
      color: white;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      max-width: 420px;
    }

    header h1 {
      font-size: 28px;
      margin: 0 0 10px 0;
    }

    header p {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.85;
    }

    #sketch-container {
      width: 100vw;
      height: 100vh;
    }

    footer {
      position: absolute;
      bottom: 15px;
      left: 20px;
      font-size: 12px;
      opacity: 0.6;
      z-index: 10;
    }
  </style>
</head>

<body>

  <header>
    <h1>The Battle for Cybertron</h1>
    <p>
     Move your mouse to guide the Autobot to destroy the decpticons!
    </p>
  </header>

  <div id="sketch-container"></div>


  <footer>
    Built with p5.js with Motion and interaction design
  </footer>

</body>
</html>
